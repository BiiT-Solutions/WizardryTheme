name: Update Version
on:
  workflow_run:
    workflows: ["Publish Library"]
    types:
      - completed

concurrency:
  group: update-version
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          # workflow_run checks out the commit that triggered the run, but main
          # may have moved since then. Always bump from the latest main.
          ref: main
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Increase version
        run: |
          set -euo pipefail

          # Attribute the commits to the GitHub Actions bot account so they are
          # linked to a GitHub user (required by the "unattributed changes"
          # branch rule if branch protection is enabled again).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Bump the root package (@biit-solutions/storybook). This creates the
          # "Version: X.Y.Z" commit and the vX.Y.Z annotated tag, as before.
          npm version patch --force -m "Version: %s"
          new_version=$(node -p "require('./package.json').version")

          # Mirror the same version in the library entry point.
          sed -i -e "s|^  \"version\".*|  \"version\": \"${new_version}\",|g" projects/wizardry-theme/package.json
          git add projects/wizardry-theme/package.json
          git commit -m "Component version: ${new_version}"

          # --follow-tags publishes the vX.Y.Z tag along with main.
          git push origin HEAD:main --follow-tags
